server:
  port: 9090
spring:
  application:
    name: hmdp-complete
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本项目默认使用独立数据库 hmdp_complete，与原版 hmdp 项目互不影响。
    # 切回共享库会让本副本的新增迁移写进共享库的 Flyway 历史，导致原项目启动时校验失败，禁止这样做。
    url: ${HMDP_DB_URL:jdbc:mysql://127.0.0.1:3306/hmdp_complete?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${HMDP_DB_USERNAME:root}
    password: ${HMDP_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 全新空库从 V1 开始完整建库；baseline 只在接入“有表但没用过 Flyway”的库时把版本记为 0，V1 仍会执行
    baseline-version: 0
  redis:
    host: ${HMDP_REDIS_HOST:127.0.0.1}
    port: ${HMDP_REDIS_PORT:6379}
    password: ${HMDP_REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略空字段
mybatis-plus: 
  type-aliases-package: com.hmdp.entity # 别名扫描包

# 认证方式模板开关（Session + JWT 可并存）
# - enabled: true 时会启用拦截器注册（AuthMvcConfig）
# - JWT 解析/验签、Session 写入逻辑需要你在模板类里补全
hmdp:
  auth:
    enabled: true
    # auth.method 支持：auto（默认：jwt -> redis-token -> session）或逗号分隔优先级列表（例如：jwt,redis-token）
    method: redis-token
    jwt:
      # 不提供开发默认密钥；为空时 JWT 解析器不生效。
      secret: ${HMDP_JWT_SECRET:}
  upload:
    root: ${HMDP_UPLOAD_ROOT:./data/uploads}
    public-prefix: /imgs/
    max-bytes: 5242880
    max-width: 10000
    max-height: 10000
    max-pixels: 40000000
    temp-retention-hours: 24
    cleanup-batch-size: 100
    cleanup-interval-ms: 3600000
    deleting-retry-delay-minutes: 5
  idempotency:
    cleanup-interval-ms: 86400000
  # 管理身份：这里配置的用户 ID 视为运营人员，秒杀券/店铺等管理写接口只对这些人开放
  admin:
    user-ids: ${HMDP_ADMIN_USER_IDS:1}
  seckill:
    # 消费失败的消息最多重试次数，超过后进入死信列表等待人工处理
    max-retry: 5
    # 每次轮询重试的待处理消息数量
    claim-batch-size: 10
    # 售罄订阅后活动开始前 N 分钟发送提醒
    remind-ahead-minutes: 10
  feed:
    push:
      # 作者粉丝数不超过该阈值时，发布博客写入粉丝收件箱（推模式）；大 V 走拉模式
      fan-threshold: 5000
      # 单个粉丝收件箱最多保留的博客数，超出后最旧的被淘汰
      inbox-capacity: 200
  recommend:
    # for_you 模式各召回通道名额（占比按候选池 200 折算）
    quota:
      for-you: 80
      interest: 40
      cf: 20
      hot: 60
    # 协同过滤召回：用当前用户最近点过赞的 N 篇博客寻找相似候选
    cf-recent-likes: 10
logging:
  level:
    com.hmdp: debug
